name: CI health dashboard

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      exercise_alert:
        description: Open and close a clearly labelled synthetic alert issue
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  dashboard:
    name: Generate CI health report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test report logic
        run: node --test
      - name: Collect public CI metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node src/report.mjs
      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-health-dashboard
          path: dist/
          if-no-files-found: warn
          retention-days: 7
      - name: Flag latest main-branch CI failures
        if: always() && github.event_name == 'schedule'
        run: node src/check-health.mjs

  notify:
    name: Synchronize CI incident
    needs: dashboard
    if: >-
      always() && (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.exercise_alert))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        id: download
        with:
          name: ci-health-dashboard
          path: dist/
      - name: Update incident or exercise notification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXERCISE: ${{ github.event_name == 'workflow_dispatch' && inputs.exercise_alert }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          if [ "$EXERCISE" = true ]; then
            node src/notify.mjs --exercise
          elif [ "$DOWNLOAD_OUTCOME" != success ]; then
            node src/notify.mjs --report-unavailable
          else
            node src/notify.mjs
          fi
